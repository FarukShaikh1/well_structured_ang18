<div class="app-tabs-container">
  <!-- Tabs -->
  <div class="app-tabs">
    <button type="button" class="app-tab" [class.active]="activeTab === 'approval'" (click)="activeTab = 'approval'">
      <i class="bi bi-person-check"></i>
      <span>Pending Approval</span>
    </button>

    <button type="button" class="app-tab" [class.active]="activeTab === 'users'" (click)="activeTab = 'users'">
      <i class="bi bi-people"></i>
      <span>Active Users</span>
    </button>

    <button type="button" class="app-tab" [class.active]="activeTab === 'permissions'"
      (click)="activeTab = 'permissions'">
      <i class="bi bi-shield-lock"></i>
      <span>User Permissions</span>
    </button>

    <button type="button" class="app-tab" [class.active]="activeTab === 'settings'"
      (click)="activeTab = 'settings'">
      <i class="bi bi-shield-lock"></i>
      <span>Settings</span>
    </button>
  </div>


  <!-- Tab Content -->
  <div class="app-tab-content">

    <!-- Available Users -->
    @if (activeTab === 'users') {
    <app-tabulator-grid [tableData]="filteredTableData" [columnConfig]="columnConfig" [height]="'200px'"
      [paginationSize]="paginationSize" [filterColumns]="filterColumns" [allowCSVExport]="allowCSVExport"
      [isLoading]="isGridLoading" [loadingText]="'Loading users...'" [allowPrint]="allowPrint" [allowAdd]="allowAdd"
      (addClicked)="openDayDetailsPopup('')" [allowRefresh]="allowRefresh" (refreshClicked)="refreshData()"
      [gridName]="'Available Users'">
    </app-tabulator-grid>
    }


    <!-- User Permissions -->
    @if (activeTab === 'permissions') {
    <div class="tab-component-wrapper">
      <app-user-permission></app-user-permission>
    </div>
    }

    <!-- Users For Approval -->
    @if (activeTab === 'approval') {
    <div class="tab-component-wrapper">
      <app-user-registration-approval></app-user-registration-approval>
    </div>
    }

    @if (activeTab === 'settings') {
    <div class="tab-component-wrapper">
      <app-settings></app-settings>
    </div>
    }

  </div>
</div>

<!-- Common Components -->

<app-toaster></app-toaster>
<app-day-details></app-day-details>
<app-user-details></app-user-details>
<app-confirmation-dialog (outputAction)="handleConfirmResult($event)">
</app-confirmation-dialog>

<!-- Hidden modal buttons -->
<button id="openDayDetailsButton" type="button" data-bs-toggle="modal" data-bs-target="#detailsPopup"
  style="display:none">
</button>

<button id="openUserDetailsButton" type="button" data-bs-toggle="modal" data-bs-target="#userDetailsPopup"
  style="display:none">
</button>
