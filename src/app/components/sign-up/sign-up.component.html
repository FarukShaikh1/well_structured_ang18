<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-sm-12 col-md-12 col-lg-12">
            <div class="card shadow-md">
                <div class="card-body">
                    <h2 class="text-center mb-4">
                       Create Account
                    </h2>
                    <div class="mb-3">
                        <label class="form-label">
                            Date of Birth
                        </label>
                        <input
                            type="date"
                            [(ngModel)]="model.dateOfBirth"
                            class="form-control form-control-lg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Name
                        </label>
                        <input
                            type="text"
                            [(ngModel)]="model.name"
                            placeholder="Enter your name"
                            class="form-control form-control-lg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            [(ngModel)]="model.email"
                            placeholder="Enter your email"
                            class="form-control form-control-lg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Mobile Number
                        </label>
                        <input
                            type="tel"
                            [(ngModel)]="model.mobileNumber"
                            placeholder="Enter mobile number"
                            maxlength="10"
                            class="form-control form-control-lg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Address
                        </label>
                        <textarea
                            [(ngModel)]="model.address"
                            placeholder="Enter your address"
                            rows="3"
                            class="form-control form-control-lg">
                       </textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">
                            Profile Photo
                        </label>
                        <input
                            type="file"
                            accept="image/*"
                            (change)="onPhotoSelected($event)"
                            class="form-control form-control-lg">
                        <small
                            *ngIf="selectedPhoto"
                            class="text-muted">
                            {{ selectedPhoto.name }}
                        </small>
                    </div>
                    <div class="d-flex gap-2">
                        <button
                            type="button"
                            class="btn btn-primary flex-fill"
                            (click)="submit()"
                            [disabled]="isSubmitting">
                            {{ isSubmitting
                                ? 'Submitting...'
                                : 'Sign Up'
                            }}
                        </button>
                        <button
                            type="button"
                            class="btn btn-secondary"
                            (click)="clear()">
                            Clear
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<app-toaster></app-toaster>
