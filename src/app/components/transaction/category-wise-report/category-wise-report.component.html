<div class="row">

  <div class="col-12 col-lg-6 mb-4">

    <div class="card pb-2 ps-2 pe-2">

      <app-transaction-pie-chart
        [reportData]="categoryWiseReportResponse"
        [reportType]="reportType">
      </app-transaction-pie-chart>

    </div>

  </div>

  <div class="col-12 col-lg-6 mb-4">

    <div class="card pb-2 ps-2 pe-2">

      <app-transaction-report-chart
        [reportData]="categoryWiseReportResponse">
      </app-transaction-report-chart>

    </div>

  </div>

</div>

<div class="mb-2">

  <app-tabulator-grid
    [tableData]="filteredTableData"
    [columnConfig]="columnConfig"
    [height]="'320px'"
    [paginationSize]="paginationSize"
    [filterColumns]="filterColumns"
    [allowCSVExport]="allowCSVExport"
    [allowPrint]="allowPrint"
    [allowRefresh]="allowRefresh"
    [allowColumnFilters]="allowColumnFilters"
    [gridName]="'Category Wise Report'"
    (refreshClicked)="refreshData()">
  </app-tabulator-grid>

</div>
