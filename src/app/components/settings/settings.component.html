<div class="main-body">
    <div class="row">
        @if(isSuperAdmin)
        {
        <div class="col-4 col-md-3 col-lg-2 pt-2">
            <select id="roleSelect" class="form-select form-control-lg text-dark bg-transparent"
                (change)="changeUser($event)">
                <option value="">Select User</option>
                @for(item of userList;track $index){
                <option value="{{ item.id }}">{{ item.firstName + ' ' +item.lastName }}</option>
                }
            </select>
        </div>
        }
        <div class="col-5 col-md-3 col-lg-3 pt-2">
            <button class="btn btn-danger rounded-button rounded-button-small" type="button"
                (click)="openDetailPopup('',UserConfig.ACCOUNT)" data-bs-toggle="modal"
                data-bs-target="#configDetailsPopup">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                    <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
                Add Account
            </button>
        </div>
        <div class="col-12 col-lg-12 pt-2">
            <app-tabulator-grid [tableData]="filteredAccountTableData" [columnConfig]="accountColumnConfig"
                [height]="'320px'" [paginationSize]="paginationSize" [filterColumns]="filterColumns"
                [allowCSVExport]="allowCSVExport" [isLoading]="isAccountGridLoading"
                [loadingText]="'Loading accounts...'">
            </app-tabulator-grid>
        </div>
    </div>
    <div class="row">
        <div class="col-5 col-md-3 col-lg-3 pt-2">
            <button class="btn btn-danger rounded-button rounded-button-small" type="button"
                (click)="openDetailPopup('',UserConfig.RELATION)" data-bs-toggle="modal"
                data-bs-target="#configDetailsPopup">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                    <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
                Add Relation
            </button>
        </div>
        <div class="col-12 col-lg-12 pt-2">
            <app-tabulator-grid [tableData]="filteredOccasionTypeTableData" [columnConfig]="occasionTypeColumnConfig"
                [height]="'320px'" [paginationSize]="paginationSize" [filterColumns]="filterColumns"
                [allowCSVExport]="allowCSVExport" [isLoading]="isOccasionTypeGridLoading"
                [loadingText]="'Loading occasion types...'">
            </app-tabulator-grid>
        </div>
    </div>
    <div class="row">
        <div class="col-5 col-md-3 col-lg-3 pt-2">
            <button class="btn btn-danger rounded-button rounded-button-small" type="button"
                (click)="openDetailPopup('',UserConfig.OCCASION_TYPE)" data-bs-toggle="modal"
                data-bs-target="#configDetailsPopup">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                    <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" />
                </svg>
                Add Occasion Type
            </button>
        </div>
        <div class="col-12 col-lg-12 pt-2">
            <app-tabulator-grid [tableData]="filteredRelationTableData" [columnConfig]="relationColumnConfig"
                [height]="'320px'" [paginationSize]="paginationSize" [filterColumns]="filterColumns"
                [allowCSVExport]="allowCSVExport" [isLoading]="isRelationGridLoading"
                [loadingText]="'Loading relations...'">
            </app-tabulator-grid>
        </div>
    </div>
    <app-configuration-details></app-configuration-details>
</div>
